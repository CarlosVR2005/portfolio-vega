intro:
  es: "Tefnut, diosa egipcia de la humedad, nace del pétalo que cae al vacío desde la flor de loto de Ra y se condensa en frío, bruma y rocío. Tras la separación forzada de los hermanos, queda anclada entre Geb y Nut: su existencia fertiliza y calma, pero también puede desatar tormentas. Ama a Shu y lo complementa, aunque su unión los vuelve inestables: juntos se componen y, a la vez, se disuelven."
  en: "Tefnut, the Egyptian goddess of moisture, is born from a petal that falls into the void from Ra's lotus flower, condensing into cold, mist and dew. After the siblings are forcibly separated, she is left anchored between Geb and Nut: her existence brings fertility and calm, but can also unleash storms. She loves Shu and complements him, yet their union makes them unstable: together they form, and at the same time dissolve."
